name: CF token check

# Manual, throwaway check: confirms the CF_API_KEY repo secret is a valid
# CurseForge API token by calling the WoW upload API's game-versions endpoint
# (the same one the packager authenticates against). Prints only the HTTP status
# code -- never the token or the response body.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate CurseForge API token
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -z "$CF_API_KEY" ]; then echo "CF_API_KEY secret is empty/unset"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "X-Api-Token: $CF_API_KEY" \
            https://wow.curseforge.com/api/game/versions)
          echo "CurseForge API HTTP status: $code"
          if [ "$code" = "200" ]; then
            echo "RESULT: token VALID (CurseForge accepted it)"
          else
            echo "RESULT: token INVALID or no access (expected 200)"
            exit 1
          fi
